target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "docs",
    "frontend",
    "scratch",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[format]
quote-style = "double"
indent-style = "space"
