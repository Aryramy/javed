[project]
name = "javed"
version = "0.1.0"
description = "JARVIS (Project Javed) — Intelligent Autonomous Assistant"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Javed Team" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "deepagents>=0.7.32",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langchain-openrouter>=0.2.9",
    "aiosqlite>=0.20.0",
    "langchain[mcp]==1.4.7",
    "mcp-server-time==2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/javed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

