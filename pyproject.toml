[project]
name = "javed"
version = "0.1.0"
description = "JARVIS (Project Javed) — Intelligent Autonomous Assistant"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Javed Team" }
]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/javed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
